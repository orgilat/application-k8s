  type: ClusterIP
---
# Source: exposure/templates/web-service.yaml
apiVersion: v1
kind: Service

metadata:
  name: web

spec:

  selector:
    app: web

  ports:

    - port: 5173
      targetPort: 5173

  type: ClusterIP
---
# Source: exposure/templates/api-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: exposure-exposure-api

  labels:
    app.kubernetes.io/name: exposure
    app.kubernetes.io/instance: exposure
    app.kubernetes.io/managed-by: Helm

spec:

  replicas: 2

  selector:
    matchLabels:
      app: api

  template:

    metadata:
      labels:
        app: api

    spec:

      containers:

        - name: api

          image: "exposure-api:latest"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          env:

            - name: NODE_ENV
              value: local

            - name: DATABASE_URL
              value: postgresql://exposureops:exposureops@postgres:5432/exposureops

            - name: REDIS_URL
              value: redis://redis:6379
---
# Source: exposure/templates/redis-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: exposure-exposure-redis

spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis

          image: "redis:7-alpine"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 6379
---
# Source: exposure/templates/web-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: exposure-exposure-web

spec:
  replicas: 1

  selector:
    matchLabels:
      app: web

  template:

    metadata:
      labels:
        app: web

    spec:

      containers:

        - name: web

          image: "exposure-web:latest"
          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 5173

          env:

            - name: VITE_API_BASE_URL
              value: http://exposure-exposure-api:3000
---
# Source: exposure/templates/worker-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: exposure-exposure-worker

spec:
  replicas: 1

  selector:
    matchLabels:
      app: worker

  template:

    metadata:
      labels:
        app: worker

    spec:

      containers:

        - name: worker

          image: "exposure-worker:latest"
          imagePullPolicy: IfNotPresent

          env:

            - name: DATABASE_URL
              value: postgresql://exposureops:exposureops@postgres:5432/exposureops

            - name: REDIS_URL
              value: redis://redis:6379
---
# Source: exposure/templates/postgres-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: exposure-exposure-postgres

spec:
  serviceName: postgres

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:

    metadata:
      labels:
        app: postgres

    spec:

      containers:

        - name: postgres

          image: "postgres:15-alpine"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432

          env:

            - name: POSTGRES_DB
              value: exposureops

            - name: POSTGRES_USER
              value: exposureops

            - name: POSTGRES_PASSWORD
              value: exposureops

          volumeMounts:

            - name: postgres-data
              mountPath: /var/lib/postgresql/data


  volumeClaimTemplates:

    - metadata:
        name: postgres-data

      spec:

        accessModes:
          - ReadWriteOnce

        resources:

          requests:
            storage: 5Gi
