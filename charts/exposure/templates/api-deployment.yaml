apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "exposure.fullname" . }}-api

  labels:
    {{- include "exposure.labels" . | nindent 4 }}

spec:

  replicas: {{ .Values.api.replicaCount }}

  selector:
    matchLabels:
      app: api

  template:

    metadata:
      labels:
        app: api

    spec:

      containers:

        - name: api

          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: {{ .Values.api.port }}

          env:

            - name: NODE_ENV
              value: local

            - name: DATABASE_URL
              value: postgresql://exposureops:exposureops@postgres:5432/exposureops

            - name: REDIS_URL
              value: redis://redis:6379