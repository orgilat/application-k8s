apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ include "exposure.fullname" . }}-postgres

spec:
  serviceName: postgres

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:

    metadata:
      labels:
        app: postgres

    spec:

      containers:

        - name: postgres

          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432

          env:

            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}

            - name: POSTGRES_USER
              value: {{ .Values.postgres.username }}

            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password }}

          volumeMounts:

            - name: postgres-data
              mountPath: /var/lib/postgresql/data


  volumeClaimTemplates:

    - metadata:
        name: postgres-data

      spec:

        accessModes:
          - ReadWriteOnce

        resources:

          requests:
            storage: 5Gi