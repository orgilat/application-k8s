global:
  scrape_interval: 1m
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: api
    static_configs:
      - targets: ["api:3000"]

  - job_name: automation-results-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - automation-results-exporter:3001
